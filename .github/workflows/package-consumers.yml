name: Package Consumer Compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install build SDK and supported consumer runtimes
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Test freshly packed packages on .NET 10 and 11
        run: bash tools/verify-package-consumers.sh
