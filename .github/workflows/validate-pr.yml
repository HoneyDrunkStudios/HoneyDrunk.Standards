name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.props'
      - '**.targets'
      - '**/.editorconfig'
      - '**/stylecop.json'
      - '**/*.runsettings'
      - '.github/**'
      - 'unity/**'

permissions:
  contents: read
  checks: write
  pull-requests: write  # This allows posting PR comments
  issues: write
  security-events: write # Required by the reusable PR Core CodeQL job

jobs:
  pr-validation:
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/pr-core.yml@main
    with:
      dotnet-version: '10.0.x'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      working-directory: 'HoneyDrunk.Standards'
      enable-secret-scan: false
      enable-accessibility-check: false
      post-pr-summary: true
      actions-ref: 'main'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}


  unity-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: unity/global.json
      - name: Build and verify Unity analyzer profile
        run: python3 unity/scripts/build.py --output artifacts/unity
      - uses: actions/upload-artifact@v4
        with:
          name: honeydrunk-unity-profile
          path: artifacts/unity
          if-no-files-found: error
