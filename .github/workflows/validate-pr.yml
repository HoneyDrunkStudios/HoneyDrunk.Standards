name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.slnx'
      - '**.props'
      - '**.targets'
      - 'global.json'
      - '**/.editorconfig'
      - '**/stylecop.json'
      - '**/*.runsettings'
      - '.github/**'
      - 'unity/**'
      - 'tools/**'

permissions:
  contents: read
  checks: write
  pull-requests: write  # This allows posting PR comments
  issues: write
  security-events: write # Required by the reusable PR Core CodeQL job

jobs:
  package-consumers:
    uses: ./.github/workflows/package-consumers.yml
    permissions:
      contents: read

  pr-validation:
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write
      issues: write
      security-events: write
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/pr-core.yml@main
    with:
      dotnet-version: '11.0.100'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      working-directory: '.'
      project-path: 'HoneyDrunk.Standards.slnx'
      enable-secret-scan: false
      enable-accessibility-check: false
      post-pr-summary: true
      actions-ref: 'main'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}


  repository-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test file layout and new-code diagnostics checks
        run: python3 -m unittest discover -s tools/tests -v

  unity-profile:
    name: ${{ matrix.check }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            check: unity-profile
          - os: windows-latest
            check: unity-profile-windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: unity/global.json
      - name: Build and verify Unity analyzer profile
        run: python unity/scripts/build.py --output artifacts/unity
      - uses: actions/upload-artifact@v4
        with:
          name: honeydrunk-unity-profile-${{ matrix.os }}
          path: artifacts/unity
          if-no-files-found: error
